name: Tests

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:

jobs:
    static:
        name: PHPStan and unit tests (${{ matrix.dependencies }} Shopware 6.7, PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { php: '8.2', dependencies: lowest }
                    - { php: '8.3', dependencies: highest }
                    - { php: '8.4', dependencies: highest }
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: intl, pdo_mysql, zip, gd
                  coverage: none

            - name: Install Shopware and the dev tools (${{ matrix.dependencies }} versions)
              run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

            - name: Shopware version under test
              run: composer show shopware/core | grep -E '^versions'

            - name: PHPStan
              run: composer phpstan -- --no-progress

            - name: Unit tests
              run: composer test

    integration:
        name: Integration (Shopware ${{ matrix.shopware }})
        runs-on: ubuntu-latest
        continue-on-error: ${{ matrix.shopware == 'trunk' }}
        strategy:
            fail-fast: false
            matrix:
                # lowest version composer.json promises, latest release, next minor (early warning)
                shopware: ['v6.7.14.0', 'v6.7.16.0', 'trunk']
        steps:
            - uses: shopware/github-actions/setup-extension@main
              with:
                  extensionName: MnSalesChannelScope
                  shopwareVersion: ${{ matrix.shopware }}
                  install: true
                  # older releases may have known vulnerabilities; fine for a throwaway test shop
                  allow-insecure-versions: true

            - name: Administration internals the plugin overrides still exist
              run: php custom/plugins/MnSalesChannelScope/tests/ci/check-admin-overrides.php src/Administration/Resources/app/administration/src

            - name: Test data (a limited user, records of another sales channel)
              run: |
                  php custom/plugins/MnSalesChannelScope/tests/ci/seed.php "$PWD" >> "$GITHUB_ENV"
                  for preset in orders products categories marketing cms settings; do bin/console mn:channel-scope:preset "$preset" scope-ci; done

            - name: Leak check
              run: |
                  php -S 127.0.0.1:8000 -t public public/index.php > /tmp/server.log 2>&1 &
                  for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8000/api/_info/version && break; sleep 1; done
                  SCOPE_SHOP_URL=http://127.0.0.1:8000 php custom/plugins/MnSalesChannelScope/tests/acceptance/leak-check.php

    js:
        name: Administration (node)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Unit tests
              run: node --experimental-detect-module --test tests/js/

    presets:
        name: Preset files
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Every preset is valid JSON
              run: for f in src/Resources/config/presets/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
